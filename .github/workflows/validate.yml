name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-guards:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WeChat metadata guard
        shell: pwsh
        run: ./scripts/windows/feagle-android.ps1 validate-manifest
      - name: Validate pinned Windows toolchain metadata
        shell: pwsh
        run: ./scripts/windows/feagle-android.ps1 validate-toolchain
      - name: Check tool bootstrap plan without downloads or license acceptance
        shell: pwsh
        run: ./scripts/windows/feagle-android.ps1 bootstrap-tools -DryRun
      - name: Validate Android Agent source and Gradle wrapper metadata
        shell: pwsh
        run: ./scripts/windows/feagle-android.ps1 validate-android-source
      - name: Test Android CLI extraction from a long repository path
        shell: powershell
        run: ./scripts/windows/test-long-path-bootstrap.ps1
      - name: Reject an APK that does not match the reference
        shell: pwsh
        run: |
          Set-Content -LiteralPath ./invalid.apk -Value "not-an-apk" -NoNewline
          ./scripts/windows/feagle-android.ps1 verify-apk -ApkPath ./invalid.apk
          if ($LASTEXITCODE -eq 0) {
            throw "Invalid APK was unexpectedly accepted"
          }
          Write-Host "Invalid APK rejected as expected"
          exit 0

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build Android Agent
        working-directory: android
        run: ./gradlew clean :app:assembleDebug --no-daemon
